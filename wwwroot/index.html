<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/">Tasks</a>
        <time id="current-date"></time>
      </header>

      <main>
        <section class="intro">
          <p class="eyebrow">YOUR DAY</p>
          <h1>Good morning, JARVIS.</h1>
          <p class="subtitle">A clear mind starts with a clear list.</p>
        </section>

        <section class="statistics-card" aria-labelledby="statistics-heading">
          <div class="statistics-heading">
            <p class="eyebrow" id="statistics-heading">ACTIVITY STATISTICS</p>
            <span>All activity this session</span>
          </div>
          <div class="statistics-grid">
            <div class="stat"><strong id="created-stat">0</strong><span>Created</span></div>
            <div class="stat"><strong id="completed-stat">0</strong><span>Completed</span></div>
            <div class="stat"><strong id="deleted-stat">0</strong><span>Deleted</span></div>
          </div>
        </section>

        <section class="task-card" aria-labelledby="tasks-heading">
          <h2 id="tasks-heading" class="visually-hidden">Tasks</h2>
          <form class="quick-add" id="quick-add">
            <input
              id="task-title"
              type="text"
              placeholder="Add a task"
              maxlength="120"
              autocomplete="off"
              required
            />
            <button type="submit" aria-label="Add task">+</button>
          </form>

          <div class="list-header">
            <div class="filters" role="tablist" aria-label="Task filters">
              <button
                class="filter active"
                type="button"
                data-filter="all"
                role="tab"
                aria-selected="true"
              >
                All
              </button>
              <button
                class="filter"
                type="button"
                data-filter="open"
                role="tab"
                aria-selected="false"
              >
                Open
              </button>
              <button
                class="filter"
                type="button"
                data-filter="done"
                role="tab"
                aria-selected="false"
              >
                Done
              </button>
            </div>
            <span class="task-count" id="task-count">0 tasks</span>
          </div>

          <div class="task-list" id="task-list" aria-live="polite"></div>

          <div class="list-footer">
            <span id="progress-label">0 open</span>
            <button id="clear-completed" type="button">Clear completed</button>
          </div>
        </section>

        <p class="shortcut"><kbd>N</kbd> to add a task</p>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
