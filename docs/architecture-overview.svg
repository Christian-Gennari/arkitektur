<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title description">
  <title id="title">NordPost eventdriven arkitektur</title>
  <desc id="description">Shipment API sparar försändelsen och publicerar ett event till en Channel. EventBus distribuerar eventet till public tracking, kundnotifieringar, operationsstatistik och postal audit. Event Monitor visar flödet via SSE.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      .title{fill:#0f172a;font:700 22px system-ui,sans-serif}.section{fill:#64748b;font:700 12px system-ui,sans-serif;letter-spacing:1.2px}.label{fill:#0f172a;font:650 14px system-ui,sans-serif}.detail{fill:#64748b;font:12px system-ui,sans-serif}.edge{fill:#475569;font:600 11px system-ui,sans-serif}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.event{fill:#eff6ff;stroke:#93c5fd}.consumer{fill:#f0fdf4;stroke:#86efac}.monitor{fill:#fff7ed;stroke:#fdba74}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.event-line{stroke:#2563eb}.return{stroke:#ea580c;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1100" height="640" rx="18" fill="#f8fafc"/>
  <text x="42" y="42" class="title">NordPost · Publish / Subscribe</text>
  <text x="42" y="73" class="section">SYNKRONT COMMAND-FLÖDE</text>
  <text x="42" y="247" class="section">ASYNKRONT EVENTFLÖDE</text>

  <path class="line" d="M218 145H291M459 145H532M700 145H773"/>
  <text x="235" y="132" class="edge">HTTP</text>
  <rect x="42" y="100" width="176" height="90" rx="14" class="node"/><text x="130" y="138" text-anchor="middle" class="label">Operations UI</text><text x="130" y="162" text-anchor="middle" class="detail">Commands &amp; queries</text>
  <rect x="291" y="100" width="168" height="90" rx="14" class="node"/><text x="375" y="138" text-anchor="middle" class="label">Shipment API</text><text x="375" y="162" text-anchor="middle" class="detail">HTTP endpoints</text>
  <rect x="532" y="100" width="168" height="90" rx="14" class="node"/><text x="616" y="138" text-anchor="middle" class="label">ShipmentService</text><text x="616" y="162" text-anchor="middle" class="detail">Event producer</text>
  <rect x="773" y="100" width="285" height="90" rx="14" class="node"/><text x="915" y="138" text-anchor="middle" class="label">Shipment repository</text><text x="915" y="162" text-anchor="middle" class="detail">Primärt tillstånd</text>

  <path class="line event-line" d="M616 190V230H375V290"/>
  <text x="490" y="220" text-anchor="middle" class="edge">ShipmentRegistered / Dispatched / Delivered / Cancelled</text>
  <rect x="291" y="290" width="168" height="90" rx="14" class="node event"/><text x="375" y="328" text-anchor="middle" class="label">.NET Channel</text><text x="375" y="352" text-anchor="middle" class="detail">FIFO eventkö</text>
  <path class="line event-line" d="M459 335H532"/>
  <rect x="532" y="290" width="168" height="90" rx="14" class="node event"/><text x="616" y="328" text-anchor="middle" class="label">EventBus</text><text x="616" y="352" text-anchor="middle" class="detail">Background dispatcher</text>

  <path class="line event-line" d="M700 310H773M700 335H773M700 360H773M700 375V495H773"/>
  <rect x="773" y="250" width="285" height="62" rx="12" class="node consumer"/><text x="915" y="277" text-anchor="middle" class="label">Public tracking</text><text x="915" y="298" text-anchor="middle" class="detail">Kundorienterad read model</text>
  <rect x="773" y="324" width="285" height="62" rx="12" class="node consumer"/><text x="915" y="351" text-anchor="middle" class="label">Customer notifications</text><text x="915" y="372" text-anchor="middle" class="detail">Statusmeddelanden</text>
  <rect x="773" y="398" width="285" height="62" rx="12" class="node consumer"/><text x="915" y="425" text-anchor="middle" class="label">Operations metrics</text><text x="915" y="446" text-anchor="middle" class="detail">Eventuellt konsistenta räknare</text>
  <rect x="773" y="472" width="285" height="62" rx="12" class="node consumer"/><text x="915" y="499" text-anchor="middle" class="label">Postal audit</text><text x="915" y="520" text-anchor="middle" class="detail">Revisionslogg</text>

  <path class="line event-line" d="M616 380V575H773"/>
  <rect x="773" y="548" width="285" height="62" rx="12" class="node monitor"/><text x="915" y="575" text-anchor="middle" class="label">Event Monitor</text><text x="915" y="596" text-anchor="middle" class="detail">Observability via SSE</text>
  <path class="line return" d="M773 579H170Q130 579 130 539V190"/>
  <text x="330" y="570" text-anchor="middle" class="edge">Server-Sent Events</text>
</svg>
